<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=../eds/tjrj-pje/">
  <link rel="canonical" href="../eds/tjrj-pje/">
  <title>TJRJ · PJe — redirecionando</title>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem">Se não abrir automaticamente, <a href="../eds/tjrj-pje/">continuar para TJRJ · PJe</a>.</p>
<button class="btn-top" id="btnTop" aria-label="Voltar ao topo" title="Voltar ao topo">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
</button>
<script>
  (function(){
    var btn=document.getElementById('btnTop');
    if(!btn)return;
    window.addEventListener('scroll',function(){btn.classList.toggle('visible',window.scrollY>300)},{passive:true});
    btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
  })();
</script>
</body>
</html>
